name: Apply Readiness Warning Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and verify patch
        run: |
          cp .github/transfer/readiness-warning-fix.patch.gz.b64 /tmp/readiness-warning-fix.b64
          echo "73c3da7e80aa4e30104d36ad7134ceafc200c3772721a212d0096fbb53efa3ad  /tmp/readiness-warning-fix.b64" | sha256sum --check
          base64 --decode /tmp/readiness-warning-fix.b64 | gzip --decompress > /tmp/readiness-warning-fix.patch
          git apply --check /tmp/readiness-warning-fix.patch

      - name: Apply fix and remove transport files
        run: |
          git config user.name "wihlarkop"
          git config user.email "20562624+wihlarkop@users.noreply.github.com"
          git apply --index /tmp/readiness-warning-fix.patch
          git rm .github/transfer/readiness-warning-fix.patch.gz.b64 .github/workflows/apply-readiness-warning-fix.yml
          git commit -m "fix: keep readiness state reactive to route data"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

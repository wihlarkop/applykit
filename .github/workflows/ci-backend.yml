name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Export resolved lock
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: resolved-uv-lock
          path: backend/uv.lock
          retention-days: 1

      - name: Lint
        # Keep the CI contract explicit so future Ruff default changes do not
        # introduce unrelated failures across the existing codebase.
        run: uvx ruff check --select E4,E7,E9,F .

      - name: Run tests
        run: uv run --frozen pytest

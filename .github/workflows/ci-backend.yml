name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Commit resolved lock
        if: matrix.python-version == '3.12'
        working-directory: .
        run: |
          if git diff --quiet -- backend/uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          git commit -m "build: refresh backend dependency lock"
          git push origin HEAD:${{ github.head_ref }}

      - name: Lint
        # Keep the CI contract explicit so future Ruff default changes do not
        # introduce unrelated failures across the existing codebase.
        run: uvx ruff check --select E4,E7,E9,F .

      - name: Run tests
        run: uv run --frozen pytest

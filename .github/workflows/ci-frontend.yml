name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve auth dependencies
        run: bun add @zxcvbn-ts/core @zxcvbn-ts/language-common @zxcvbn-ts/language-en

      - name: Commit dependency lock
        working-directory: .
        run: |
          if git diff --quiet -- frontend/package.json frontend/bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/bun.lock
          git commit -m "build: add password strength dependencies"
          git push origin HEAD:${{ github.head_ref }}

      - name: Unit tests
        run: bun run test

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

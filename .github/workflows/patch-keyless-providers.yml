name: Patch keyless provider integration

on:
  push:
    branches:
      - work/fix-keyless-providers

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/fix-keyless-providers
          fetch-depth: 0

      - name: Integrate keyless providers across backend and frontend
        run: |
          python - <<'PY'
          from pathlib import Path

          llm_path = Path('backend/app/services/llm.py')
          llm = llm_path.read_text()
          import_anchor = 'from app.public_errors import LLM_PROVIDER_ERROR_MESSAGE\n'
          llm = llm.replace(
              import_anchor,
              import_anchor + 'from app.services.settings import is_llm_configured\n',
              1,
          )
          if llm.count('    if not provider or not api_key:\n') != 2:
              raise SystemExit('expected two LLM configuration guards')
          llm = llm.replace(
              '    if not provider or not api_key:\n',
              '    if not is_llm_configured(provider, api_key):\n',
          )

          old_sync = '''        response = litellm.completion(
                      model=provider,
                      messages=messages,
                      api_key=api_key,
                      timeout=timeout,
                  )
          '''
          new_sync = '''        request_kwargs = {
                      "model": provider,
                      "messages": messages,
                      "timeout": timeout,
                  }
                  if api_key:
                      request_kwargs["api_key"] = api_key
                  response = litellm.completion(**request_kwargs)
          '''
          if llm.count(old_sync) != 1:
              raise SystemExit('sync completion block not found')
          llm = llm.replace(old_sync, new_sync, 1)

          old_async = '''        response = await litellm.acompletion(
                      model=provider,
                      messages=messages,
                      api_key=api_key,
                      stream=True,
                      stream_options={"include_usage": True},
                      timeout=60,
                  )
          '''
          new_async = '''        request_kwargs = {
                      "model": provider,
                      "messages": messages,
                      "stream": True,
                      "stream_options": {"include_usage": True},
                      "timeout": 60,
                  }
                  if api_key:
                      request_kwargs["api_key"] = api_key
                  response = await litellm.acompletion(**request_kwargs)
          '''
          if llm.count(old_async) != 1:
              raise SystemExit('async completion block not found')
          llm_path.write_text(llm.replace(old_async, new_async, 1))

          types_path = Path('frontend/src/lib/types.ts')
          types = types_path.read_text()
          types = types.replace('  api_key: string;\n', '  api_key: string | null;\n', 1)
          stale = '  api_key: string | null;\n  current_model: string | null;\n'
          if types.count(stale) != 1:
              raise SystemExit('stale integration key field not found')
          types_path.write_text(types.replace(stale, '  current_model: string | null;\n', 1))

          modal_path = Path('frontend/src/lib/components/SettingsModal.svelte')
          modal = modal_path.read_text()
          modal = modal.replace(
              "    // Ollama needs no key; set a placeholder so the backend validation passes\n    apiKey = id === 'ollama' ? 'ollama' : '';\n",
              "    apiKey = '';\n",
              1,
          )
          modal = modal.replace(
              "    const keyToTest = selectedProvider?.requires_api_key ? apiKey : 'ollama';\n    if (selectedProvider?.requires_api_key && !keyToTest) return;\n",
              "    const keyToTest = apiKey.trim() || null;\n    if (selectedProvider?.requires_api_key && !keyToTest) return;\n",
              1,
          )
          modal = modal.replace(
              "    const keyToSave = selectedProvider?.requires_api_key ? apiKey.trim() : 'ollama';\n",
              "    const keyToSave = apiKey.trim() || null;\n",
              1,
          )
          modal_path.write_text(modal)

          page_path = Path('frontend/src/routes/settings/+page.svelte')
          page = page_path.read_text()
          page = page.replace(
              '  const anyConfigured = $derived(integrations.some((i) => i.api_key_configured));\n',
              "  const anyConfigured = $derived(\n    integrations.some((i) => i.api_key_configured || (i.id === 'ollama' && Boolean(i.current_model)))\n  );\n",
              1,
          )
          page_path.write_text(page)
          PY

      - name: Remove temporary helper and commit
        run: |
          rm .github/workflows/patch-keyless-providers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/llm.py frontend/src/lib/types.ts frontend/src/lib/components/SettingsModal.svelte frontend/src/routes/settings/+page.svelte .github/workflows/patch-keyless-providers.yml
          git commit -m "fix: remove Ollama API key placeholders"
          git push origin HEAD:work/fix-keyless-providers

name: Patch usage logging integration

on:
  push:
    branches:
      - work/fix-llm-usage-logging

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/fix-llm-usage-logging
          fetch-depth: 0

      - name: Replace per-call threads with dispatcher
        run: |
          python - <<'PY'
          from pathlib import Path

          llm_path = Path('backend/app/services/llm.py')
          text = llm_path.read_text()
          text = text.replace('import threading\n', '')
          text = text.replace('from app.database import get_db_context\n', '')
          text = text.replace('from app.models import LlmUsageLog\n', '')

          import_anchor = 'from app.exceptions.llm import APIKeyNotConfiguredError, LLMCallError\n'
          if text.count(import_anchor) != 1:
              raise SystemExit('unexpected LLM exception import count')
          text = text.replace(
              import_anchor,
              import_anchor + 'from app.services.usage_logging import log_usage_background\n',
              1,
          )

          start = text.index('# ---------------------------------------------------------------------------\n# Usage logging (background)')
          end = text.index('# ---------------------------------------------------------------------------\n# Synchronous LLM call', start)
          text = text[:start] + text[end:]
          text = text.replace('_log_usage_background(', 'log_usage_background(')
          text = text.replace('provider=provider,', 'model_identifier=provider,')
          llm_path.write_text(text)

          main_path = Path('backend/main.py')
          main = main_path.read_text()
          route_import = 'from app.http_client import start_http_client, stop_http_client\n'
          if main.count(route_import) != 1:
              raise SystemExit('unexpected HTTP client import count')
          main = main.replace(
              route_import,
              route_import + 'from app.services.usage_logging import stop_usage_logger\n',
              1,
          )
          shutdown = '    finally:\n        await stop_http_client()\n'
          if main.count(shutdown) != 1:
              raise SystemExit('unexpected lifespan shutdown block')
          main = main.replace(
              shutdown,
              '    finally:\n        stop_usage_logger()\n        await stop_http_client()\n',
              1,
          )
          main_path.write_text(main)
          PY

      - name: Remove temporary helper and commit
        run: |
          rm .github/workflows/patch-usage-logging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/llm.py backend/main.py .github/workflows/patch-usage-logging.yml
          git commit -m "fix: route usage logs through bounded dispatcher"
          git push origin HEAD:work/fix-llm-usage-logging

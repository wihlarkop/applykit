name: Apply Onboarding Implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and verify patch
        run: |
          cat .github/transfer/part-* > /tmp/applykit-feature.b64
          echo "12f528305839fc084dd58e8c6c9c5c50e3617e761e2707d32efd889622859377  /tmp/applykit-feature.b64" | sha256sum --check
          base64 --decode /tmp/applykit-feature.b64 | gzip --decompress > /tmp/applykit-feature.patch
          git apply --check /tmp/applykit-feature.patch

      - name: Apply implementation and remove transport files
        run: |
          git config user.name "wihlarkop"
          git config user.email "20562624+wihlarkop@users.noreply.github.com"
          git apply --index /tmp/applykit-feature.patch
          git rm -r .github/transfer .github/workflows/source-snapshot.yml
          git commit -m "feat: add guided onboarding and AI readiness"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

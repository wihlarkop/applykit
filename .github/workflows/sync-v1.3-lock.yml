name: Sync v1.3 lockfile

on:
  push:
    branches:
      - docs/role-match-v1.3.0
    paths:
      - backend/pyproject.toml
      - .github/workflows/sync-v1.3-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/role-match-v1.3.0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: '3.12'

      - name: Regenerate backend lockfile
        working-directory: backend
        run: uv lock

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- backend/uv.lock; then
            echo "backend/uv.lock is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          git commit -m "chore: sync v1.3.0 backend lockfile"
          git push origin HEAD:docs/role-match-v1.3.0

services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - applykit-data:/data
    environment:
      DATABASE_URL: sqlite:////data/applykit.db
      CREDENTIAL_KEY_FILE: /data/credential.key
      CORS_ORIGINS: '["http://localhost:3000"]'
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # This URL is used by the browser — it must be reachable from the user's machine.
        # For local Docker: http://localhost:8000/api (default)
        # For a remote server: change to your domain, e.g. https://applykit.example.com/api
        VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  applykit-data:
    # SQLite and the credential encryption key are stored here.
    # Back up the whole volume so encrypted credentials remain recoverable.
